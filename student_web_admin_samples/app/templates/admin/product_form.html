{% extends "base.html" %}

{% block title %}Товар{% endblock %}

{% block content %}
<div class="page-head">
    <div><h1>{{ "Редактирование товара" if product.id else "Новый товар" }}</h1></div>
</div>
<form class="form-card" method="post">
    <label>Название
        <input name="name" value="{{ product.name or '' }}" required>
    </label>
    <label>Артикул
        <input name="sku" value="{{ product.sku or '' }}" required>
    </label>
    <label>Категория
        <select name="category_id" required>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Цена
        <input type="number" step="0.01" min="0" name="price" value="{{ product.price or 0 }}" required>
    </label>
    <label>Остаток
        <input type="number" min="0" name="stock_quantity" value="{{ product.stock_quantity or 0 }}" required>
    </label>
    <label class="checkbox">
        <input type="checkbox" name="is_active" {% if product.is_active or not product.id %}checked{% endif %}>
        Активен
    </label>
    <div class="form-actions">
        <button type="submit">Сохранить</button>
        <a href="{{ url_for('admin.products') }}">Отмена</a>
    </div>
</form>
{% endblock %}
