{% if pagination.pages > 1 %}
<nav class="pagination">
    {% if pagination.has_prev %}
    <a href="{{ url_for(request.endpoint, page=pagination.prev_num, **request.view_args) }}">Назад</a>
    {% endif %}
    <span>Страница {{ pagination.page }} из {{ pagination.pages }}</span>
    {% if pagination.has_next %}
    <a href="{{ url_for(request.endpoint, page=pagination.next_num, **request.view_args) }}">Вперёд</a>
    {% endif %}
</nav>
{% endif %}
